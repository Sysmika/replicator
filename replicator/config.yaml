name: Replicator
version: "0.1.0"
slug: replicator
description: Stock, compras, vencimientos y gastos de la casa, con foto e IA
url: https://github.com/Sysmika/replicator
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:cart-variant
panel_title: Replicator
homeassistant_api: true   # avisos al celular por notify.mobile_app_*
hassio_api: true          # leer el slug propio para que el aviso abra el panel
options:
  ia_habilitada: false
  orion_gateway_url: https://ia.orion.com.ar
  orion_gateway_key: ""
  avisos_activos: false
  avisos_hora: "09:00"
  avisos_celulares: []
  avisos_compras: false
schema:
  ia_habilitada: bool
  orion_gateway_url: url
  orion_gateway_key: password?
  avisos_activos: bool
  avisos_hora: match(^([01]\d|2[0-3]):[0-5]\d$)
  avisos_celulares:
    - match(^notify\.[a-z0-9_]+$)
  avisos_compras: bool
