configuration:
  orion_gateway_url:
    name: AI service URL
    description: Do not change unless told by Orion.
  avisos_activos:
    name: Due-date reminders to phones
    description: Sends a daily summary of overdue or upcoming bills to the Home Assistant apps.
  avisos_hora:
    name: Reminder time
    description: HH:MM format, for example 09:00.
  avisos_celulares:
    name: Phones that receive the reminder
    description: notify services for each phone, e.g. notify.mobile_app_pixel.
  avisos_compras:
    name: Include shopping list
    description: Adds how many products are missing when there are already bills to remind.
